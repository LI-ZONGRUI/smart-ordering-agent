[project]
name = "framework-agent"
version = "0.1.0"
description = "Local FastAPI and LangChain foundation for a read-only ordering assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "langchain==1.4.2",
  "langchain-core==1.6.5",
  "langchain-openai==1.6.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
